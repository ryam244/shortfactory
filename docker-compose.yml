services:
  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    ports:
      - "${VOICEVOX_PORT:-50021}:50021"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:50021/version"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shortfactory}
      POSTGRES_USER: ${POSTGRES_USER:-shortfactory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shortfactory-local-only}
    volumes:
      - shortfactory-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shortfactory}:${POSTGRES_PASSWORD:-shortfactory-local-only}@postgres:5432/${POSTGRES_DB:-shortfactory}
      SHORTFACTORY_STORAGE_ROOT: /data/storage
      SHORTFACTORY_SESSION_SECRET: ${SHORTFACTORY_SESSION_SECRET:-local-only-change-me}
      NODE_ENV: production
    volumes:
      - shortfactory-storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["pnpm", "--filter", "@shortfactory/video", "worker:render:watch"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shortfactory}:${POSTGRES_PASSWORD:-shortfactory-local-only}@postgres:5432/${POSTGRES_DB:-shortfactory}
      SHORTFACTORY_STORAGE_ROOT: /data/storage
      REMOTION_BROWSER_EXECUTABLE: /usr/bin/chromium
    volumes:
      - shortfactory-storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  shortfactory-postgres:
  shortfactory-storage:
